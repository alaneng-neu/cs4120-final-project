[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs4120-final-project"
version = "0.1.0"
description = "Email spam and phishing classification project for CS4120"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
# Use the src/ layout
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
